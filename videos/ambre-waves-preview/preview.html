<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambre — aperçu vivant</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071e26;color:#f3e9d2;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px}main{display:flex;flex-direction:column;align-items:center;gap:12px}.canvas{position:relative;overflow:hidden;width:var(--w);height:var(--h);border-radius:14px;box-shadow:0 12px 55px #0009}iframe{width:887px;height:1774px;border:0;transform:scale(var(--scale));transform-origin:0 0}footer{display:flex;align-items:center;gap:14px;font-size:13px;color:#c8d5d8}button{font:inherit;color:#f3e9d2;border:1px solid #627f86;background:#123b47;border-radius:30px;padding:9px 18px;cursor:pointer}#status{min-width:120px}h1{font-size:15px;font-weight:500;margin:0}aside{max-width:230px;line-height:1.6;color:#b5c8cd;font-size:14px}aside strong{color:#e4c47d}@media(max-width:700px){aside{display:none}body{padding:8px}}
</style></head><body><main><h1>Domaine d’Ambre · aperçu vivant</h1><div class="canvas"><iframe id="film" src="index.html" title="Domaine avec houle et gestes des habitants"></iframe></div><footer><button id="play">Pause</button><span id="status">Lecture en boucle</span></footer></main><aside><strong>La mer et les habitants</strong><p>Houle plus visible, reflets mobiles et petits gestes des travailleurs.</p><p>Étude d’ambiance sur une illustration : les habitants s’animent sur place.</p></aside><script>
const frame=document.getElementById('film');let running=true,time=0,last=0;
function resize(){const scale=Math.min((innerHeight-110)/1774,(innerWidth-(innerWidth>700?310:16))/887,1);document.documentElement.style.setProperty('--scale',scale);document.documentElement.style.setProperty('--w',887*scale+'px');document.documentElement.style.setProperty('--h',1774*scale+'px')}
resize();addEventListener('resize',resize);
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'Pause':'Reprendre';document.getElementById('status').textContent=running?'Lecture en boucle':'En pause'};
function tick(now){if(last&&running)time+=(now-last)/1000;last=now;const tl=frame.contentWindow.__timelines?.['ambre-waves'];if(tl)tl.time(time%6,false);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></body></html>
