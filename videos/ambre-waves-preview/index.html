<script>
// Deterministic six-second cycle; the external viewer alone owns autoplay.
const phase={value:0};
const waterPhase=document.getElementById('water-phase');
const workers=[{id:1,x:382,y:752,p:0},{id:2,x:615,y:1079,p:1.1},{id:3,x:232,y:1134,p:2.2},{id:4,x:714,y:419,p:0.7},{id:5,x:677,y:877,p:1.6}];
const applyWater=()=>{
 const angle=phase.value*Math.PI*2;
 waterPhase.setAttribute('dx',(28*Math.sin(angle)).toFixed(4));
 waterPhase.setAttribute('dy',(15*Math.cos(angle)).toFixed(4));
 document.getElementById('foam-near').setAttribute('transform',`translate(${6*Math.sin(angle)},${3*Math.cos(angle)})`);
 document.getElementById('foam-near').setAttribute('opacity',0.19+0.13*Math.sin(angle+0.6));
 document.getElementById('foam-far').setAttribute('transform',`translate(${9*Math.sin(angle+1)},${4*Math.cos(angle+1)})`);
 workers.forEach(w=>document.getElementById('worker-'+w.id).setAttribute('transform',`rotate(${2.8*Math.sin(2*angle+w.p)} ${w.x} ${w.y})`));
};
const tl=gsap.timeline({paused:true});
tl.fromTo(phase,{value:0},{value:1,duration:6,ease:'none',onUpdate:applyWater},0);
window.__timelines=window.__timelines||{};
window.__timelines['ambre-waves']=tl;tl.seek(0);applyWater();
</script></body></html>
